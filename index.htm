<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Швидка допомога</title>
<style>
  :root{
    --bg:#0f1620; --panel:#182233; --panel2:#1f2c40;
    --text:#eef2f7; --muted:#9fb0c3;
    --red:#e5484d; --red-bg:#3a1518;
    --orange:#f5a524; --orange-bg:#3a2a0f;
    --green:#3ecf8e; --green-bg:#0f3626;
    --accent:#4f8cff; --border:#2a3a52;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  header h1{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .badge{font-size:11px;background:var(--orange-bg);color:var(--orange);
    border:1px solid var(--orange);padding:2px 8px;border-radius:10px;}
  .callbar{display:flex;gap:8px;margin-top:8px;}
  .callbtn{flex:1;text-align:center;padding:10px 0;border-radius:10px;
    text-decoration:none;font-weight:700;font-size:15px;}
  .call103{background:var(--red-bg);color:var(--red);border:1px solid var(--red);}
  .call112{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  main{flex:1;padding:16px;padding-bottom:100px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px;margin-bottom:14px;}
  .qtext{font-size:19px;line-height:1.4;font-weight:600;margin:0 0 6px;}
  .note{color:var(--muted);font-size:14px;margin:0 0 10px;line-height:1.4;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .opt{padding:14px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:16px;text-align:left;
    cursor:pointer;}
  .opt:active{opacity:.7;}
  .opt.unknown{border-style:dashed;color:var(--muted);}
  .outcome{border-radius:14px;padding:18px;margin-bottom:14px;}
  .outcome.emergency{background:var(--red-bg);border:1px solid var(--red);}
  .outcome.urgent{background:var(--orange-bg);border:1px solid var(--orange);}
  .outcome.green{background:var(--green-bg);border:1px solid var(--green);}
  .outcome h2{margin:0 0 10px;font-size:19px;}
  .outcome.emergency h2{color:var(--red);}
  .outcome.urgent h2{color:var(--orange);}
  .outcome.green h2{color:var(--green);}
  .outcome ul{margin:6px 0 12px;padding-left:20px;}
  .outcome li{margin-bottom:6px;line-height:1.4;}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:14px 0 4px;}
  .disclaimer{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.4;}
  .navrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .navbtn{padding:11px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer;}
  .navbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
    border-top:1px solid var(--border);padding:10px 16px;
    max-width:520px;margin:0 auto;display:flex;gap:8px;z-index:5;}
  .worsen{flex:1;padding:13px;border-radius:12px;border:1px solid var(--red);
    background:var(--red-bg);color:var(--red);font-weight:700;font-size:14px;}
  .homebtn{padding:13px 16px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);font-size:14px;}
  .menugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .menugrid .opt{text-align:center;font-size:14px;padding:14px 8px;}
  .backrow{margin-bottom:10px;}
  .backbtn{background:none;border:none;color:var(--muted);font-size:14px;
    padding:6px 0;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🚨 Швидка допомога <span class="badge">робоча версія · не валідовано медично</span></h1>
    <div class="callbar">
      <a class="callbtn call103" href="tel:103">📞 103</a>
      <a class="callbtn call112" href="tel:112">📞 112</a>
    </div>
  </header>
  <main id="main"></main>
  <footer id="footer" style="display:none;">
    <button class="worsen" id="worsenBtn">⚠️ СТАН ПОГІРШИВСЯ</button>
    <button class="homebtn" id="homeBtn">На початок</button>
  </footer>
</div>

<script>
/* =========================================================
   ДАНІ: питання/дії (FLOW) — окремо від рушія (медична матриця)
   Кожен вузол:
   { type:'q', text, note, options:[{label,next}] }
   { type:'end', level:'emergency'|'urgent'|'green', title, call:true/false,
     doNow:[...], doNot:[...], monitor:[...] }
   ========================================================= */
const PRIMARY_ENTRY = 'A1';
const MENU_ENTRY = 'MENU';

const YN = (yes, no, unknown, cannot) => [
  {label:'Так', next:yes},
  {label:'Ні', next:no},
  {label:'Не знаю', next:unknown, cls:'unknown'},
  {label:'Не можу перевірити', next:cannot || unknown, cls:'unknown'}
];

const FLOW = {

  // ---------- СТАРТ ----------
  START:{type:'q', text:'Хто потребує допомоги?', options:[
    {label:'Я', next:'Q01'},
    {label:'Інший дорослий', next:'Q01'},
    {label:'Дитина', next:'CHI1'},
    {label:'Немовля', next:'INF1'},
    {label:'Людина не може відповідати', next:'OBS1'},
    {label:'Не знаю', next:'OBS1'}
  ]},

  Q01:{type:'q', text:'Чи може людина нормально говорити та виконувати прості прохання?',
    options:[
      {label:'Так', next:PRIMARY_ENTRY},
      {label:'Ні', next:'OBS1'},
      {label:'Не знаю', next:'CHECK_RESPONSE', cls:'unknown'},
      {label:'Не можу перевірити', next:'CHECK_RESPONSE', cls:'unknown'}
    ]},

  CHECK_RESPONSE:{type:'q',
    text:'Перевірте реакцію',
    note:'Зверніться до людини. Запитайте: «Як Вас звати?» або попросіть виконати просту дію (наприклад, потиснути руку).',
    options:[
      {label:'Відповідає нормально', next:PRIMARY_ENTRY},
      {label:'Не відповідає', next:'OBS_BREATH'},
      {label:'Відповідає дивно / неадекватно', next:'END_ALTERED_MENTAL'},
      {label:'Не можу перевірити', next:'OBS1'}
    ]},

  END_ALTERED_MENTAL:{type:'end', level:'emergency', call:true,
    title:'Можлива гостра зміна свідомості',
    doNow:[
      'Не залишайте людину саму.',
      'Перевірте дихання (чи піднімається грудна клітка, чи чутні нормальні вдихи).',
      'Якщо є блювання — поверніть людину на бік, щоб уникнути потрапляння блювотних мас у дихальні шляхи.',
      'Зафіксуйте час, коли Ви помітили зміну стану.'
    ],
    doNot:['Не давайте їжу, воду або ліки.', 'Не залишайте без нагляду.'],
    monitor:['Дихання', 'Свідомість', 'Колір губ/шкіри']},

  // ---------- РЕЖИМ СПОСТЕРІГАЧА (людина не може відповідати) ----------
  OBS1:{type:'q', text:'Людина реагує на голос або дотик (плескання по плечу)?',
    options: YN('OBS_BREATH','OBS_BREATH','OBS_BREATH')},

  OBS_BREATH:{type:'q', text:'Подивіться на грудну клітку. Людина дихає?',
    note:'Спостерігайте кілька секунд.',
    options: YN('OBS_BREATH_NORMAL','END_CPR','END_CPR','END_CPR')},

  OBS_BREATH_NORMAL:{type:'q', text:'Дихання виглядає нормальним (не рідке, не хрипке, не утруднене)?',
    options: YN('OBS_BLEED','END_BREATHING_EMERGENCY','OBS_BLEED','OBS_BLEED')},

  OBS_BLEED:{type:'q', text:'Є видима сильна кровотеча?',
    options: YN('END_BLEEDING','OBS_SEIZURE','OBS_SEIZURE','OBS_SEIZURE')},

  OBS_SEIZURE:{type:'q', text:'Є судоми зараз або зафіксовано, що вони щойно були?',
    options: YN('END_SEIZURE_NOW','OBS_SWELL','OBS_SWELL','OBS_SWELL')},

  OBS_SWELL:{type:'q', text:'Є набряк горла/язика, висип по всьому тілу або відомо про алергію?',
    options: YN('END_ANAPHYLAXIS','OBS_TRAUMA','OBS_TRAUMA','OBS_TRAUMA')},

  OBS_TRAUMA:{type:'q', text:'Є очевидна тяжка травма (падіння з висоти, ДТП, сильна деформація кінцівки)?',
    options: YN('END_TRAUMA','END_UNCONSCIOUS','OBS1B','OBS1B')},

  OBS1B:{type:'end', level:'emergency', call:true,
    title:'Людина не реагує нормально',
    doNow:[
      'Викличте допомогу негайно.',
      'Залишайтеся поруч, продовжуйте спостерігати за диханням.',
      'Якщо дихання зупиниться або стане ненормальним — почніть непрямий масаж серця (СЛР), якщо вмієте.'
    ],
    doNot:['Не залишайте людину саму.'],
    monitor:['Дихання', 'Реакція', 'Колір шкіри/губ']},

  // ---------- PRIMARY: A — дихальні шляхи ----------
  A1:{type:'q', text:'Людина може нормально говорити або видавати звуки?',
    options: YN('B1','A2','CHECK_AIRWAY','CHECK_AIRWAY')},

  A2:{type:'q', text:'Людина може вдихнути (не задихається, не хапає ротом повітря беззвучно)?',
    options: YN('B1','END_CHOKING','CHECK_AIRWAY','CHECK_AIRWAY')},

  CHECK_AIRWAY:{type:'q', text:'Перевірте дихальні шляхи',
    note:'Подивіться, чи є щось у роті, що заважає диханню (їжа, блювотні маси, сторонній предмет).',
    options:[
      {label:'Шляхи вільні, людина дихає', next:'B1'},
      {label:'Є перешкода / людина задихається', next:'END_CHOKING'},
      {label:'Не можу перевірити', next:'B1', cls:'unknown'}
    ]},

  // ---------- B — дихання ----------
  B1:{type:'q', text:'Людина нормально дихає?',
    options: YN('C1','END_BREATHING_EMERGENCY','CHECK_BREATHING','CHECK_BREATHING')},

  CHECK_BREATHING:{type:'q', text:'Перевірте дихання',
    note:'Подивіться на грудну клітку. Чи піднімається вона? Чи є нормальні вдихи протягом кількох секунд?',
    options:[
      {label:'Дихання нормальне', next:'C1'},
      {label:'Дуже утруднене / ненормальне', next:'END_BREATHING_EMERGENCY'},
      {label:'Не дихає', next:'END_CPR'},
      {label:'Не можу перевірити', next:'OBS1B', cls:'unknown'}
    ]},

  // ---------- C — кровотеча ----------
  C1:{type:'q', text:'Є сильна зовнішня кровотеча?',
    options: YN('END_BLEEDING','D1','CHECK_BLEEDING','CHECK_BLEEDING')},

  CHECK_BLEEDING:{type:'q', text:'Перевірте наявність кровотечі',
    note:'Огляньте одяг та тіло людини на предмет крові, що швидко просочується або накопичується.',
    options:[
      {label:'Кровотечі не виявлено', next:'D1'},
      {label:'Виявлено сильну кровотечу', next:'END_BLEEDING'},
      {label:'Не можу перевірити', next:'D1', cls:'unknown'}
    ]},

  // ---------- D — неврологія ----------
  D1:{type:'q', text:'Раптово виникла слабкість або оніміння руки чи ноги (особливо з одного боку)?',
    options: YN('END_STROKE','D2','CHECK_NEURO','D2')},

  D2:{type:'q', text:'Раптово змінилася мова (незрозуміла, плутана)?',
    options: YN('END_STROKE','D3','D3','D3')},

  D3:{type:'q', text:'Раптово перекосило обличчя (асиметрія при посмішці)?',
    options: YN('END_STROKE','D4','D4','D4')},

  D4:{type:'q', text:'Була раптова втрата свідомості або судоми щойно?',
    options:[
      {label:'Втрата свідомості', next:'OBS_BREATH'},
      {label:'Судоми', next:'END_SEIZURE_NOW'},
      {label:'Ні', next:'E1'},
      {label:'Не знаю', next:'E1', cls:'unknown'}
    ]},

  CHECK_NEURO:{type:'q', text:'Проста перевірка',
    note:'Попросіть людину посміхнутися та підняти обидві руки одночасно.',
    options:[
      {label:'Все симетрично, без відхилень', next:'D2'},
      {label:'Є асиметрія / слабкість', next:'END_STROKE'},
      {label:'Не можу перевірити', next:'D2', cls:'unknown'}
    ]},

  // ---------- E — інші очевидні загрози ----------
  E1:{type:'q', text:'Чи є очевидна тяжка травма, сильний набряк горла/язика, важка алергічна реакція, отруєння, утоплення або інша ситуація, яка виглядає небезпечною?',
    options:[
      {label:'Тяжка травма', next:'END_TRAUMA'},
      {label:'Набряк горла/язика або алергія', next:'END_ANAPHYLAXIS'},
      {label:'Можливе отруєння', next:'PO1'},
      {label:'Нічого з цього', next:'MENU'},
      {label:'Не знаю', next:'MENU', cls:'unknown'}
    ]},

  // ---------- ГОЛОВНЕ МЕНЮ ----------
  MENU:{type:'menu', text:'Оберіть, що турбує найбільше', options:[
    {label:'Важко дихати', next:'BR1'},
    {label:'Біль у грудях', next:'CP1'},
    {label:'Кровотеча', next:'C1'},
    {label:'Слабкість / мова / обличчя', next:'D1'},
    {label:'Судоми', next:'SZ1'},
    {label:'Алергія', next:'AN1'},
    {label:'Травма', next:'TR1'},
    {label:'Опік', next:'BRN1'},
    {label:'Отруєння', next:'PO1'},
    {label:'Укус / ужалення', next:'BI1'},
    {label:'Головний біль', next:'HD1'},
    {label:'Біль у животі', next:'ABD1'},
    {label:'Блювання', next:'VO1'},
    {label:'Температура', next:'FE1'},
    {label:'Не знаю, що саме — просто дуже погано', next:'UNK1'}
  ]},

  // ---------- BR-01 — утруднене дихання ----------
  BR1:{type:'q', text:'Чи важко людині дихати зараз?', options: YN('BR2','MENU','BR2','BR2')},
  BR2:{type:'q', text:'Людина не може нормально говорити через задишку (лише окремі слова)?',
    options: YN('END_BREATHING_EMERGENCY','BR3','BR3','BR3')},
  BR3:{type:'q', text:'Є синюшність губ/обличчя, різке погіршення, непритомність або сильна слабкість?',
    options: YN('END_BREATHING_EMERGENCY','BR4','BR4','BR4')},
  BR4:{type:'q', text:'Стан швидко погіршується?',
    options: YN('END_BREATHING_EMERGENCY','END_BREATHING_URGENT','END_BREATHING_URGENT','END_BREATHING_URGENT')},

  // ---------- CP-01 — біль у грудях ----------
  CP1:{type:'q', text:'Біль виник раптово?', options: YN('CP2','CP2','CP2','CP2')},
  CP2:{type:'q', text:'Є задишка разом із болем?', options: YN('END_CHEST_EMERGENCY','CP3','CP3','CP3')},
  CP3:{type:'q', text:'Є холодний піт, сильна слабкість, нудота або майже непритомність?',
    options: YN('END_CHEST_EMERGENCY','CP4','CP4','CP4')},
  CP4:{type:'q', text:'Біль дуже сильний або посилюється?',
    options: YN('END_CHEST_EMERGENCY','END_CHEST_URGENT','END_CHEST_URGENT','END_CHEST_URGENT')},

  // ---------- ST — інсульт (вхід із меню, якщо минули D1 без спрацювання) ----------
  // (D1-D4 вже покривають інсульт-подібні симптоми)

  // ---------- SZ-01 — судоми ----------
  SZ1:{type:'q', text:'Судоми відбуваються прямо зараз?', options: YN('END_SEIZURE_NOW','SZ2','SZ2','SZ2')},
  SZ2:{type:'q', text:'Після судом людина не приходить до нормальної свідомості (минуло понад кілька хвилин)?',
    options: YN('END_SEIZURE_EMERGENCY','END_SEIZURE_URGENT','END_SEIZURE_URGENT','END_SEIZURE_URGENT')},

  // ---------- AN-01 — алергія ----------
  AN1:{type:'q', text:'Є набряк язика, губ або горла?', options: YN('END_ANAPHYLAXIS','AN2','AN2','AN2')},
  AN2:{type:'q', text:'Є утруднене дихання або зміна голосу (хрипкість)?', options: YN('END_ANAPHYLAXIS','AN3','AN3','AN3')},
  AN3:{type:'q', text:'Є висип по тілу разом зі слабкістю, запамороченням або іншими системними симптомами?',
    options: YN('END_ANAPHYLAXIS','END_ALLERGY_MILD','END_ALLERGY_MILD','END_ALLERGY_MILD')},

  // ---------- TR-01 — травма ----------
  TR1:{type:'q', text:'Є сильна кровотеча?', options: YN('END_BLEEDING','TR2','TR2','TR2')},
  TR2:{type:'q', text:'Є втрата свідомості, порушення дихання або неврологічні симптоми (слабкість, дивна мова)?',
    options: YN('END_TRAUMA','TR3','TR3','TR3')},
  TR3:{type:'q', text:'Могла бути травма голови, шиї або хребта (падіння, удар головою, ДТП, пірнання)?',
    options: YN('END_SPINE_TRAUMA','TR4','TR4','TR4')},
  TR4:{type:'q', text:'Є очевидний перелом або тяжке ушкодження кінцівки (деформація, неможливість опори)?',
    options: YN('END_FRACTURE','END_MINOR_TRAUMA','END_MINOR_TRAUMA','END_MINOR_TRAUMA')},

  // ---------- BRN-01 — опік ----------
  BRN1:{type:'q', text:'Це хімічний або електричний опік?', options:[
    {label:'Хімічний', next:'END_CHEMICAL_BURN'},
    {label:'Електричний', next:'END_ELECTRIC_BURN'},
    {label:'Ні, термічний (вогонь/окріп/пара)', next:'BRN2'}
  ]},
  BRN2:{type:'q', text:'Опік великий (більше долоні людини), глибокий (пухирі, білий/чорний колір шкіри) або на обличчі, руках, паху, суглобах?',
    options: YN('END_BURN_EMERGENCY','END_BURN_MINOR','END_BURN_MINOR','END_BURN_MINOR')},

  // ---------- PO-01 — отруєння ----------
  PO1:{type:'q', text:'Відомо або є підозра, що людина прийняла надмірну кількість речовини, ліків, алкоголю чи хімікату?',
    options: YN('PO2','MENU','PO2','PO2')},
  PO2:{type:'q', text:'Є порушення свідомості, дуже сонливий стан, ненормальне дихання або судоми?',
    options: YN('END_POISONING_EMERGENCY','END_POISONING_URGENT','END_POISONING_URGENT','END_POISONING_URGENT')},

  // ---------- BI-01 — укус/ужалення ----------
  BI1:{type:'q', text:'Є утруднене дихання або набряк язика/горла після укусу/ужалення?',
    options: YN('END_ANAPHYLAXIS','BI2','BI2','BI2')},
  BI2:{type:'q', text:'Швидко поширюється набряк, є виражена слабкість, запаморочення або висип по тілу?',
    options: YN('END_BITE_URGENT','END_BITE_MILD','END_BITE_MILD','END_BITE_MILD')},

  // ---------- HD-01 — головний біль ----------

/* =========================== РУШІЙ =========================== */
let history = [];
let current = 'START';

const mainEl = document.getElementById('main');
const footerEl = document.getElementById('footer');

function go(id){
  history.push(current);
  current = id;
  render();
}

function goHome(){
  history = [];
  current = 'START';
  render();
}

function goBack(){
  if(history.length){
    current = history.pop();
    render();
  }
}

document.getElementById('worsenBtn').addEventListener('click', ()=>go(PRIMARY_ENTRY));
document.getElementById('homeBtn').addEventListener('click', goHome);

function render(){
  const node = FLOW[current];
  footerEl.style.display = (current === 'START') ? 'none' : 'flex';
  mainEl.innerHTML = '';

  if(history.length){
    const backRow = document.createElement('div');
    backRow.className = 'backrow';
    const b = document.createElement('button');
    b.className = 'backbtn';
    b.textContent = '← Назад';
    b.onclick = goBack;
    backRow.appendChild(b);
    mainEl.appendChild(backRow);
  }

  if(!node){
    mainEl.innerHTML += '<div class="card">Помилка сценарію. <button class="navbtn" onclick="location.reload()">Почати заново</button></div>';
    return;
  }

  if(node.type === 'q' || node.type === 'menu'){
    const card = document.createElement('div');
    card.className = 'card';
    const q = document.createElement('p');
    q.className = 'qtext';
    q.textContent = node.text;
    card.appendChild(q);
    if(node.note){
      const n = document.createElement('p');
      n.className = 'note';
      n.textContent = node.note;
      card.appendChild(n);
    }
    const opts = document.createElement('div');
    opts.className = node.type === 'menu' ? 'menugrid' : 'opts';
    node.options.forEach(o=>{
      const btn = document.createElement('button');
      btn.className = 'opt' + (o.cls ? ' '+o.cls : '');
      btn.textContent = o.label;
      btn.onclick = ()=>go(o.next);
      opts.appendChild(btn);
    });
    card.appendChild(opts);
    mainEl.appendChild(card);
    return;
  }

  if(node.type === 'end'){
    const box = document.createElement('div');
    box.className = 'outcome ' + node.level;
    const icon = node.level === 'emergency' ? '🔴' : (node.level === 'urgent' ? '🟠' : '🟢');
    box.innerHTML = `<h2>${icon} ${node.title}</h2>`;

    if(node.call){
      const callRow = document.createElement('div');
      callRow.className = 'callbar';
      callRow.innerHTML = `<a class="callbtn call103" href="tel:103">📞 103</a><a class="callbtn call112" href="tel:112">📞 112</a>`;
      box.appendChild(callRow);
    }

    if(node.doNow && node.doNow.length){
      box.innerHTML += '<div class="section-label">Зараз</div>';
      const ul = document.createElement('ul');
      node.doNow.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
      box.appendChild(ul);
    }
    if(node.doNot && node.doNot.length){
      box.innerHTML += '<div class="section-label">Не робіть</div>';
      const ul = document.createElement('ul');
      node.doNot.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
      box.appendChild(ul);
    }
    if(node.monitor && node.monitor.length){
      box.innerHTML += '<div class="section-label">Контролюйте</div>';
      const ul = document.createElement('ul');
      node.monitor.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
      box.appendChild(ul);
    }

    const navrow = document.createElement('div');
    navrow.className = 'navrow';
    const repeatBtn = document.createElement('button');
    repeatBtn.className = 'navbtn primary';
    repeatBtn.textContent = 'Повторити оцінку';
    repeatBtn.onclick = ()=>go(PRIMARY_ENTRY);
    navrow.appendChild(repeatBtn);
    if(node.level !== 'emergency'){
      const menuBtn = document.createElement('button');
      menuBtn.className = 'navbtn';
      menuBtn.textContent = 'До меню симптомів';
      menuBtn.onclick = ()=>go(MENU_ENTRY);
      navrow.appendChild(menuBtn);
    }
    box.appendChild(navrow);

    const disc = document.createElement('p');
    disc.className = 'disclaimer';
    disc.textContent = 'Це робоча, ще не валідована медично версія алгоритму. Вона не ставить діагноз і не замінює професійну медичну допомогу.';
    box.appendChild(disc);

    mainEl.appendChild(box);
    return;
  }
}

render();
</script>
